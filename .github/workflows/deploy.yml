name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deployment:
        description: Deployment name, such as live or scratch
        type: string
        default: live
      ref:
        description: Branch, tag or commit to deploy
        type: string
        default: main
      reset-data:
        description: Drop and recreate the deployment's database
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

# One group for all deployments: they share the PostgreSQL server that shared.bicep updates.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.deployment || 'live' }}
    runs-on: ubuntu-latest
    environment: azure
    env:
      DEPLOYMENT: ${{ inputs.deployment || 'live' }}
      RESET_DATA: ${{ inputs.reset-data || false }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-poolcar' }}

    steps:
      - name: Validate deployment name
        run: |
          if [[ ! "$DEPLOYMENT" =~ ^[a-z][a-z0-9]{0,15}$ ]]; then
            echo "::error::Deployment name must be 1-16 lowercase letters or digits, starting with a letter."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set image tag
        run: echo "IMAGE_TAG=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure CLI extensions
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Deploy shared infrastructure
        run: |
          registry=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "shared-$DEPLOYMENT" \
            --template-file infra/shared.bicep \
            --query properties.outputs.registryLoginServer.value \
            --output tsv)
          echo "REGISTRY=$registry" >> "$GITHUB_ENV"

      - name: Build and push images
        run: |
          az acr login --name "${REGISTRY%%.*}"
          for project in Web Fleet Reservations DbSetup; do
            dotnet publish "src/PoolCar.$project" -c Release /t:PublishContainer \
              -p ContainerRegistry="$REGISTRY" \
              -p ContainerImageTags="$IMAGE_TAG"
          done

      - name: Deploy database setup
        run: |
          job=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "database-$DEPLOYMENT" \
            --template-file infra/database.bicep \
            --parameters deploymentName="$DEPLOYMENT" imageTag="$IMAGE_TAG" resetData="$RESET_DATA" \
            --query properties.outputs.jobName.value \
            --output tsv)
          echo "DBSETUP_JOB=$job" >> "$GITHUB_ENV"

      - name: Run database setup
        run: |
          execution=$(az containerapp job start \
            --resource-group "$RESOURCE_GROUP" \
            --name "$DBSETUP_JOB" \
            --query name \
            --output tsv)
          echo "Started $execution"
          deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            status=$(az containerapp job execution show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$DBSETUP_JOB" \
              --job-execution-name "$execution" \
              --query properties.status \
              --output tsv)
            echo "Status: $status"
            case "$status" in
              Succeeded) exit 0 ;;
              Failed|Stopped|Degraded)
                echo "::error::Database setup $execution ended with status $status."
                exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Database setup $execution did not finish within 15 minutes."
          exit 1

      - name: Deploy apps
        env:
          EASYAUTH_CLIENT_ID: ${{ vars.EASYAUTH_CLIENT_ID }}
          EASYAUTH_CLIENT_SECRET: ${{ secrets.EASYAUTH_CLIENT_SECRET }}
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "apps-$DEPLOYMENT" \
            --template-file infra/main.bicep \
            --parameters deploymentName="$DEPLOYMENT" imageTag="$IMAGE_TAG" \
              easyAuthClientId="$EASYAUTH_CLIENT_ID" easyAuthClientSecret="$EASYAUTH_CLIENT_SECRET" \
            --query properties.outputs \
            --output json > apps-outputs.json

      # With an unchanged image, Reservations keeps its revision; a restart migrates and seeds the new database.
      - name: Restart Reservations
        if: inputs.reset-data
        run: |
          app="ca-$DEPLOYMENT-reservations"
          revision=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$app" \
            --query properties.latestRevisionName --output tsv)
          az containerapp revision restart --resource-group "$RESOURCE_GROUP" --name "$app" --revision "$revision"

      - name: Write summary
        run: |
          web_url="https://$(jq -r .webFqdn.value apps-outputs.json)"
          redirect_uri=$(jq -r .redirectUri.value apps-outputs.json)
          {
            echo "## Deployed \`$DEPLOYMENT\`"
            echo
            echo "- Commit: \`$IMAGE_TAG\`"
            echo "- Web: $web_url"
            echo "- Redirect URI: \`$redirect_uri\`"
          } >> "$GITHUB_STEP_SUMMARY"
