name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore PoolCar.slnx

      - name: Build solution
        run: dotnet build PoolCar.slnx --configuration Release --no-restore

      - name: Verify code formatting
        run: dotnet format --verify-no-changes

      - name: Lint Bicep
        run: |
          mkdir -p "$RUNNER_TEMP/bicep"
          curl -fsSLo "$RUNNER_TEMP/bicep/bicep" https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x "$RUNNER_TEMP/bicep/bicep"
          export PATH="$RUNNER_TEMP/bicep:$PATH"
          bicep --version
          scripts/lint-bicep.sh

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Run non-E2E tests
        run: |
          failed=0
          for proj in tests/*/*.csproj; do
            if [[ "$proj" != *"EndToEnd"* ]]; then
              echo "Testing $proj..."
              dotnet test "$proj" --configuration Release --report-xunit-trx || failed=1
            fi
          done
          exit $failed

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'
          if-no-files-found: warn

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSL_CERT_DIR: /home/runner/.aspnet/dev-certs/trust:/usr/lib/ssl/certs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore PoolCar.slnx

      - name: Build solution
        run: dotnet build PoolCar.slnx --configuration Release --no-restore

      - name: Trust development certificate
        run: dotnet dev-certs https --trust

      - name: Install Chromium
        run: pwsh tests/PoolCar.EndToEnd.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run end-to-end tests
        run: dotnet test --project tests/PoolCar.EndToEnd.Tests --configuration Release --no-build --report-xunit-trx

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: tests/PoolCar.EndToEnd.Tests/bin/Release/net10.0/TestResults/playwright-traces/
          if-no-files-found: ignore
